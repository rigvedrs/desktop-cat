name: Build Windows exe

# Run it by hand from the Actions tab, or push a tag like v1.0 to also
# publish a public download link.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6 and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: Build DesktopCat.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name DesktopCat --icon cat.ico --splash splash.png
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtDataVisualization
          cat.py

      - name: Report the size
        shell: pwsh
        run: |
          $f = Get-Item dist\DesktopCat.exe
          "DesktopCat.exe -- {0:N1} MB" -f ($f.Length / 1MB)

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCat-windows
          path: dist/DesktopCat.exe
          if-no-files-found: error

      - name: Publish a download link (only when a tag is pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopCat.exe
          append_body: true
          body: |
            Download DesktopCat.exe below and double-click it. Nothing to install.

            The first time, Windows may show "Windows protected your PC".
            Click More info, then Run anyway.
